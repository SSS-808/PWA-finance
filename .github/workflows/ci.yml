name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    branches: [main, dev]
    paths-ignore: ["docs/**", "**/*.md"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The build never calls Supabase, so placeholders are enough
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-build-placeholder
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:coverage
      - run: pnpm build

  database:
    name: Database checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase (runs migrations and seed)
        run: pnpm supabase start
      - name: pgTAP tests
        run: pnpm test:db
      - name: Generated types match the migrations
        run: |
          pnpm db:types
          git diff --exit-code src/lib/supabase/database.types.ts

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase (runs migrations and seed)
        run: pnpm supabase start
      # The local Supabase key is the same on every machine, so it is not a secret
      - name: Point the app at the local Supabase
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(pnpm -s supabase status -o env | grep '^PUBLISHABLE_KEY=' | cut -d= -f2 | tr -d '"')" >> "$GITHUB_ENV"
      - name: Install the test browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests against a built app
        run: pnpm test:e2e
      - name: Keep the report when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
